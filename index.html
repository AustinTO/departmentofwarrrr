<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Department of WARRR</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background:
          radial-gradient(ellipse at 50% 18%, rgba(37, 158, 190, 0.24), transparent 38%),
          radial-gradient(ellipse at 12% 84%, rgba(234, 175, 65, 0.1), transparent 28%),
          linear-gradient(145deg, #071923 0%, #020509 62%, #080b14 100%);
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100dvh;
        width: 100vw;
        min-height: 100%;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        box-sizing: border-box;
        touch-action: none;
      }
      #game-container {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        filter: drop-shadow(0 0 34px rgba(43, 200, 255, 0.25));
      }

      canvas {
        image-rendering: auto;
        border-radius: 18px;
        box-shadow:
          0 0 0 1px rgba(125, 244, 255, 0.25),
          0 24px 72px rgba(0, 0, 0, 0.55);
      }

      @media (max-width: 700px) {
        canvas { border-radius: 0; box-shadow: none; }
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
